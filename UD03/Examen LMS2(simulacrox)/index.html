<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 – Casa Fina (Grid)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="page-wrapper">

        <!-- CABECERA / BANNER PRINCIPAL -->
        <div class="hero-banner">
            <img src="img/hero.jpg" alt="Imagen principal" class="hero-image">

            <div class="hero-text">
                <div class="hero-title">Casa Fina</div>
                <div class="hero-subtitle">
                    Calidad, tradición y sabor.  
                    Cocina de mercado con ingredientes seleccionados.
                </div>
            </div>
        </div>

        <!-- TÍTULO DE SECCIÓN -->
        <div class="row-title">
            <div class="row-label">Especialidades destacadas</div>
        </div>

        <!-- PRIMERA FILA DE GRID -->
        <div class="grid-row">
            <div class="card">
                <img src="img/plato1.jpg" alt="Plato 1" class="card-img">
                <div class="card-text">Plato 1</div>
            </div>

            <div class="card">
                <img src="img/plato2.jpg" alt="Plato 2" class="card-img">
                <div class="card-text">Plato 2</div>
            </div>

            <div class="card">
                <img src="img/plato3.jpg" alt="Plato 3" class="card-img">
                <div class="card-text">Plato 3</div>
            </div>

            <div class="card">
                <img src="img/plato4.jpg" alt="Plato 4" class="card-img">
                <div class="card-text">Plato 4</div>
            </div>

            <div class="card">
                <img src="img/plato5.jpg" alt="Plato 5" class="card-img">
                <div class="card-text">Plato 5</div>
            </div>

            <div class="card">
                <img src="img/plato6.jpg" alt="Plato 6" class="card-img">
                <div class="card-text">Plato 6</div>
            </div>
        </div>

        <!-- SEGUNDA SECCIÓN -->
        <div class="row-title">
            <div class="row-label">Recomendaciones del chef</div>
        </div>

        <div class="grid-row">
            <div class="card card-tall">
                <img src="img/plato7.jpg" alt="Plato 7" class="card-img">
                <div class="card-text">Plato 7</div>
            </div>

            <div class="card">
                <img src="img/plato8.jpg" alt="Plato 8" class="card-img">
                <div class="card-text">Plato 8</div>
            </div>

            <div class="card">
                <img src="img/plato9.jpg" alt="Plato 9" class="card-img">
                <div class="card-text">Plato 9</div>
            </div>

            <div class="card">
                <img src="img/plato10.jpg" alt="Plato 10" class="card-img">
                <div class="card-text">Plato 10</div>
            </div>

            <div class="card">
                <img src="img/plato11.jpg" alt="Plato 11" class="card-img">
                <div class="card-text">Plato 11</div>
            </div>

            <div class="card">
                <img src="img/plato12.jpg" alt="Plato 12" class="card-img">
                <div class="card-text">Plato 12</div>
            </div>
        </div>

        <!-- PIE -->
        <div class="footer">
            <div class="footer-text">
                © 2025 Restaurante Casa Fina
            </div>
        </div>

    </div>

</body>
</html>
